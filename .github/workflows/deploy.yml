# SvelteKit deployment to GitHub Pages
name: Deploy SvelteKit to Pages

on:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

  # Only runs after SvelteKit Validation workflow completes successfully
  workflow_run:
    workflows: ["SvelteKit Validation"]
    types: [completed]
    branches:
      - "master"
      - "feature/**"

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write
  actions: read # Required to download artifacts from validation workflow

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Setup job - Install dependencies and download artifacts from validation
  setup:
    # Only run if validation workflow succeeded or manual trigger
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate SvelteKit files
        run: pnpm svelte-kit sync

      - name: Cache node_modules and SvelteKit files
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            .svelte-kit
          key: ${{ runner.os }}-pnpm-deploy-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Download flatnav artifact from validation
        uses: dawidd6/action-download-artifact@v3
        with:
          workflow: validation.yml
          name: generated-flatnav
          path: src/data/generated/
          if_no_artifact_found: warn

      - name: Download search-index artifact from validation
        uses: dawidd6/action-download-artifact@v3
        with:
          workflow: validation.yml
          name: generated-search-index
          path: src/data/generated/
          if_no_artifact_found: warn

  # Build job - Build SvelteKit for production
  build:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Restore node_modules and SvelteKit cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            .svelte-kit
          key: ${{ runner.os }}-pnpm-deploy-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-
          fail-on-cache-miss: true

      - name: Download flatnav artifact
        uses: dawidd6/action-download-artifact@v3
        with:
          workflow: validation.yml
          name: generated-flatnav
          path: src/data/generated/
          if_no_artifact_found: warn

      - name: Download search-index artifact
        uses: dawidd6/action-download-artifact@v3
        with:
          workflow: validation.yml
          name: generated-search-index
          path: src/data/generated/
          if_no_artifact_found: warn

      - name: Generate missing artifacts (fallback for manual dispatch)
        run: |
          echo "🔍 Checking for missing generated files..."

          # Check and generate flatnav if missing
          if [ ! -f src/data/generated/flatnav.ts ]; then
            echo "⚠️  flatnav.ts not found, generating locally..."
            make generate-flatnav
            echo "✅ flatnav.ts generated successfully"
          else
            echo "✅ flatnav.ts found (from validation workflow)"
          fi

          # Check and generate search-index if missing
          if [ ! -f src/data/generated/search-index.ts ]; then
            echo "⚠️  search-index.ts not found, generating locally..."
            make generate-search-index-prod
            echo "✅ search-index.ts generated successfully"
          else
            echo "✅ search-index.ts found (from validation workflow)"
          fi

      - name: Build SvelteKit
        run: pnpm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: sveltekit-build
          path: ./build
          retention-days: 1

  # Deploy job - Deploy to GitHub Pages
  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: sveltekit-build
          path: ./build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./build"

      - name: Deploy to GitHub Pages
        id: deployment
        # Only deploy if on master branch or manual trigger
        if: ${{ github.event.workflow_run.head_branch == 'master' || github.event_name == 'workflow_dispatch' }}
        uses: actions/deploy-pages@v4
