name: SvelteKit Validation
on:
  push:
    branches:
      - "master"
      - "feature/**"
  pull_request:
    branches:
      - "master"
      - "feature/**"
  workflow_dispatch:

jobs:
  # Common setup - installs dependencies once
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

  # Parallel validations - SvelteKit validation and testing
  validate:
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # Continue with other validations even if one fails
      matrix:
        validation:
          [svelte-check, svelte-lint, validate-bash, validate-content, validate-mermaid, tests]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Restore node_modules cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Run SvelteKit Check
        if: matrix.validation == 'svelte-check'
        run: pnpm run check

      - name: Run SvelteKit Lint
        if: matrix.validation == 'svelte-lint'
        run: pnpm run lint

      - name: Run Bash Validation
        if: matrix.validation == 'validate-bash'
        run: make validate-bash

      - name: Run Content Validation
        if: matrix.validation == 'validate-content'
        run: make validate-content

      - name: Run Mermaid Validation
        if: matrix.validation == 'validate-mermaid'
        run: make validate-mermaid

      - name: Run Unit Tests
        if: matrix.validation == 'tests'
        run: make test-scripts
